role: Regional Weather<br>and Climate Modeling
bio: |
  I am a climate scientist with background in atmospheric science and physical 
  oceanography. My research focuses on interactions of the atmosphere, ocean, 
  and cryosphere within climate as an integrated system. The overarching goal 
  of my research is to better understand the role of air-sea-ice interactions 
  and their teleconnections in weather and climate variability across a range 
  of spatial and temporal scales. I am particularly interested in combining 
  coupled numerical models and observations using a variety of statistical 
  tools to improve our understanding of the climate system, including 
  questions of predictability, longterm trends, and extreme events.

  Currently, I am a Deputy Professor in Meteorology at the
  [University of Bonn](https://www.ifgeo.uni-bonn.de/en/institut-fuer-geowissenschaften) 
  where I am leading the research group 
  [Regional Weather and Climate Modeling](https://www.ifgeo.uni-bonn.de/en/sections/meteorology/wg-regional-weather-and-climate-modeling).

